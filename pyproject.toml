[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tair"
version = "0.1.0"
description = "TAIR: Typed Action Inference Runtime with compact protocols and runtime action specialization"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/LDB-org/TAIR"

[project.optional-dependencies]
paper = ["matplotlib==3.10.8"]
test = ["pytest==8.4.2", "jsonschema==4.26.0", "torch==2.10.0", "numpy==2.2.6"]
local-model = ["torch==2.10.0", "transformers==5.17.0", "accelerate==1.12.0", "safetensors==0.8.0", "huggingface-hub==1.31.0", "tokenizers==0.23.2", "numpy==2.2.6", "sentencepiece==0.2.1", "protobuf==7.36.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
